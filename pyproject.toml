[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haar_analyzer"
version = "1.0.0"
description = "Пакет вейвлет-анализа Хаара для декодирования Манчестера"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.4.0",
    "pyqtgraph>=0.13.0",
    "pandas>=2.0.0",
    "numpy>=1.20.0"
]

[tool.setuptools.packages.find]
where = ["src"]
